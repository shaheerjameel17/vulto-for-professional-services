# Vulto local development stack.
#
# What this brings up is the *dependencies* — Postgres (with logical replication
# enabled), Redis, and Electric, the read-path sync service that streams each
# person's permitted rows out of Postgres (VPS-A003, F201). The web app and the
# API run on the host via `pnpm dev`, because fast reload matters more for them
# than isolation does, and because FDN-47's scope is containerized local
# *dependencies*.
#
# Copy .env.example to .env first: Electric's secret is read from there.
#
# Base images are pinned by digest, never by tag, per A007-T16. A tag moves; a
# digest does not, and an image rebuilt six months from now must be the image
# that was tested.
#
# NOT YET PRESENT, and each absence is owned:
#   services/jobs                      FDN-57
#   services/render                    FDN-70
#   services/cross-tenant-aggregation  no issue exists — see docs/Bootstrap.md
#   synthetic fixtures                 FDN-55
# A007-T18 requires this file to bring up the full stack with fixtures in one
# command. It does not yet. That gap is recorded as F71 in
# docs/Foundations_Findings.md rather than left for a reader to infer.

name: vulto

services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_USER: vulto
      POSTGRES_PASSWORD: vulto
      POSTGRES_DB: vulto
    # Electric replicates from Postgres's write-ahead log, which requires logical
    # decoding (F201, A003-T58).
    command:
      [
        "postgres",
        "-c",
        "wal_level=logical",
        "-c",
        "max_replication_slots=10",
        "-c",
        "max_wal_senders=10",
      ]
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulto -d vulto"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Electric — the read-path sync service (VPS-A001 "Sync client selection").
  # Devices never reach it directly; the API's shape proxy does (A003-T72).
  # Host port 5133 because 3000 is Next.js's. The image is pinned by digest, and
  # the version and digest are recorded in VPS-A001 in the same commit.
  electric:
    image: electricsql/electric:1.8.1@sha256:efb6fa43859d67cb8c73439e0c8bc0f7a3daa467500fb06f2a924bcb2070c139
    environment:
      # A read-only role that can see exactly four tables (A003-T58), and a
      # publication created by a migration rather than by Electric.
      DATABASE_URL: postgres://vulto_electric:${ELECTRIC_DB_PASSWORD}@postgres:5432/vulto
      ELECTRIC_SECRET: ${ELECTRIC_SECRET}
      ELECTRIC_MANUAL_TABLE_PUBLISHING: "true"
    ports:
      - "5133:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/v1/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
