# The only Rust in this repository, per VPS-A001's A001-T01. A second Rust
# service requires a superseding decision document.
#
# FDN-51 Stage 1 filled the [lib] with the wire format (src/wire/). The [[bin]]
# server is still the Stage 0 placeholder; it gets its content in Stage 2.
#
# One package, two build targets, per FDN-46:
#
#   [lib]    the shared core, A003-T10's "single shared core library used
#            identically across all platforms." Built three ways — native
#            rlib (linked into the bin below), wasm32-unknown-unknown, and
#            cdylib/staticlib for mobile FFI linking — via `cargo build --lib
#            --target <target>`, which never touches [[bin]].
#   [[bin]]  the native server placeholder in main.rs. Depends on the lib,
#            never built for wasm32 or a mobile target.
#
#            Checked rather than assumed: main.rs's TcpListener currently
#            compiles for wasm32-unknown-unknown too (std ships stub network
#            types there), so "it would not compile" is not the reason for
#            the split today. The reason that holds: `--lib` produces the
#            43-byte artifact the shared core actually is, instead of a
#            22.7KB bin nothing will ever load, and it is insurance against
#            the day main.rs gains a real native dependency with no wasm32
#            story at all.

[package]
name = "vulto-sync-engine"
version = "0.0.0"
edition = "2021"
rust-version = "1.97.1"
publish = false
description = "Vulto sync engine. Placeholder: boundary only, no sync logic."

[lib]
name = "vulto_sync_engine"
path = "src/lib.rs"
# rlib: linked into the [[bin]] below, and into any future native mobile host
#   app via a Rust dependency rather than C FFI.
# cdylib: C-ABI dynamic library — what wasm-bindgen's toolchain and Android's
#   JNI both link against.
# staticlib: what an iOS/Xcode build links statically.
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "vulto-sync-engine"
path = "src/main.rs"

[dependencies]
# Intentionally empty. The shared core (A003-T36) is transport-agnostic and
# standard-library only — no async runtime, no serialization framework, no
# codegen toolchain (A003-T42). Stage 2's [[bin]] relay adds its own runtime
# dependencies; the [lib] stays clean.

[dev-dependencies]
# Test-only, never in the shipped binary. Used by tests/wire_vectors.rs to read
# the canonical tests/vectors/*.json fixtures that also drive the TypeScript
# implementation (packages/graph/src/sync/wire.test.ts). The exact resolved
# versions are pinned in Cargo.lock and enforced by --locked in CI and Docker.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
