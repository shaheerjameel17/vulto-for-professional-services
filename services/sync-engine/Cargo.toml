# The only Rust in this repository, per VPS-A001's A001-T01. A second Rust
# service requires a superseding decision document.
#
#   [lib]    the shared sync core, A003-T10's "single shared core library used
#            identically across all platforms." Standard-library only and
#            transport-agnostic (A003-T36) — the wire format in src/wire/ and
#            nothing else. Built three ways from one source: native rlib, plus
#            wasm32-unknown-unknown and cdylib/staticlib for mobile FFI, via
#            `cargo build --lib --target <target>`.
#   relay    the relay server (FDN-51 Stage 2), `pub mod relay` in the lib but
#            `#[cfg(not(target_arch = "wasm32"))]` — it is native-only server
#            code, so the wasm and mobile targets never see it. Its Tokio/Axum
#            dependencies are declared under a cfg(not(target_arch = "wasm32"))
#            target table, so the wasm dependency graph stays empty and the
#            three-target [lib] build is unaffected. `src/main.rs` is a thin
#            entry point that calls `vulto_sync_engine::relay::serve`.

[package]
name = "vulto-sync-engine"
version = "0.0.0"
edition = "2021"
rust-version = "1.97.1"
publish = false
description = "Vulto sync engine — wire format (shared core) and the relay server."

[lib]
name = "vulto_sync_engine"
path = "src/lib.rs"
# rlib: linked into the [[bin]] below, and into any future native mobile host
#   app via a Rust dependency rather than C FFI.
# cdylib: C-ABI dynamic library — what wasm-bindgen's toolchain and Android's
#   JNI both link against.
# staticlib: what an iOS/Xcode build links statically.
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "vulto-sync-engine"
path = "src/main.rs"

[dependencies]
# Intentionally empty. The shared core (A003-T36) is transport-agnostic and
# standard-library only — no async runtime, no serialization framework, no
# codegen toolchain (A003-T42).

# Relay-server dependencies. Confined to non-wasm targets so `cargo build --lib
# --target wasm32-unknown-unknown` still resolves to zero dependencies and the
# three-target [lib] build holds. `src/relay/` is `#[cfg(not(wasm32))]` in the
# lib and uses these; the wasm/mobile targets compile only `src/wire/`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "signal",
  "sync",
  "time",
] }
axum = { version = "0.8", features = ["ws"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
# Test-only, never in the shipped binary.
#
# serde/serde_json: tests/wire_vectors.rs reads the canonical tests/vectors/*.json
#   fixtures that also drive packages/graph/src/sync/wire.test.ts.
# tokio-tungstenite/futures-util: tests/relay_ws.rs drives the relay with real
#   WebSocket clients.
#
# Exact resolved versions are pinned in Cargo.lock and enforced by --locked.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = "0.24"
futures-util = "0.3"

[profile.release]
strip = true
lto = true
codegen-units = 1
